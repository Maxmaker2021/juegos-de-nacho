function paintOps(ops,x0,y0,x1,y1){
  const w=x1-x0,h=y1-y0;
  for(const o of ops){
    if(o[0]==='vs'){const n=o[2],sw=w/n;g.fillStyle=o[1];for(let i=0;i<n;i+=2)g.fillRect(x0+i*sw,y0,sw+.5,h)}
    else if(o[0]==='rect'){g.fillStyle=o[5];g.fillRect(x0+o[1]*w,y0+o[2]*h,(o[3]-o[1])*w,(o[4]-o[2])*h)}
    else if(o[0]==='sash'){g.save();g.translate(x0+w/2,y0+h/2);g.rotate(-.7);g.fillStyle=o[1];g.fillRect(-w,-o[2]*w/2,w*2,o[2]*w);g.restore()}
    else if(o[0]==='disc'){g.fillStyle=o[1];g.beginPath();g.arc(x0+o[2]*w,y0+o[3]*h,o[4]*w,0,7);g.fill()}
    else if(o[0]==='star'){
      g.fillStyle=o[1];const cx=x0+o[2]*w,cy=y0+o[3]*h,r=o[4]*w;
      g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.4:r;g.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}
      g.closePath();g.fill();
    }
  }
}

function goalChant(){
  try{
    const a=ctx(),t=a.currentTime,D=2.7;
    const comp=a.createDynamicsCompressor();comp.connect(a.destination);
    const out=a.createGain();out.connect(comp);
    out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(.95,t+.22);
    out.gain.setValueAtTime(.95,t+1.6);out.gain.exponentialRampToValueAtTime(.0001,t+D);

    const f1=a.createBiquadFilter(),f2=a.createBiquadFilter();
    f1.type='bandpass';f1.frequency.setValueAtTime(700,t);f1.frequency.linearRampToValueAtTime(430,t+.3);f1.Q.value=3;
    f2.type='bandpass';f2.frequency.setValueAtTime(1100,t);f2.frequency.linearRampToValueAtTime(780,t+.3);f2.Q.value=4;
    const vg=a.createGain();vg.gain.value=1.4;vg.connect(f1);vg.connect(f2);f1.connect(out);f2.connect(out);
    for(let i=0;i<16;i++){
      const o=a.createOscillator();o.type='sawtooth';
      const b=rand(90,240);
      o.frequency.setValueAtTime(b*.8,t);o.frequency.linearRampToValueAtTime(b*1.08,t+.35);o.frequency.linearRampToValueAtTime(b*.92,t+D);
      const vib=a.createOscillator();vib.frequency.value=rand(4,7);

      const st=t+rand(0,.15);o.start(st);vib.start(st);o.stop(t+D);vib.stop(t+D);
    }
    // rugido de la multitud
    const len=Math.floor(a.sampleRate*D),buf=a.createBuffer(1,len,a.sampleRate),dt=buf.getChannelData(0);
    for(let i=0;i<len;i++)dt[i]=Math.random()*2-1;

  }catch(e){}
}

let mu={timer:null};
const midi=m=>440*Math.pow(2,(m-69)/12);
function volOf(id){const v=getStr('pp_vol_'+id,'');return v===''?.6:clamp(+v||0,0,1)}
function degNote(ch,S,base){const d=parseInt(ch,36);return base+S.sc[d%S.sc.length]+12*Math.floor(d/S.sc.length)}
function noteAt(a,t,f,dur,type,vel,dest,lp){
  const o=a.createOscillator(),n=a.createGain();o.type=type;o.frequency.value=f;
  n.gain.setValueAtTime(.0001,t);n.gain.exponentialRampToValueAtTime(vel,t+.01);n.gain.exponentialRampToValueAtTime(.0001,t+dur);
  if(lp){const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);fl.connect(n)}else o.connect(n);
  n.connect(dest);o.start(t);o.stop(t+dur+.02);
}
function drum(a,t,k,dest,nb){
  if(k==='k'){
    const o=a.createOscillator(),n=a.createGain();
    o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
    n.gain.setValueAtTime(.7,t);n.gain.exponentialRampToValueAtTime(.0001,t+.2);
    o.connect(n);n.connect(dest);o.start(t);o.stop(t+.22);
  }else{
    const s=a.createBufferSource();s.buffer=nb;
    const f=a.createBiquadFilter(),n=a.createGain(),sn=k==='s';
    f.type=sn?'bandpass':'highpass';f.frequency.value=sn?1800:7000;
    const dur=sn?.14:.04;
    n.gain.setValueAtTime(sn?.5:.18,t);n.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(n);n.connect(dest);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
    if(sn){const o=a.createOscillator(),g3=a.createGain();o.type='triangle';o.frequency.value=190;g3.gain.setValueAtTime(.3,t);g3.gain.exponentialRampToValueAtTime(.0001,t+.1);o.connect(g3);g3.connect(dest);o.start(t);o.stop(t+.12)}
  }
}
function musicTick(){
  const m=mu;if(!m.S)return;
  const S=m.S,sd=60/S.bpm/4;
  while(m.next<m.a.currentTime+.15){
    const i=m.step,t=m.next;
    const mc=S.mel[i%S.mel.length],bc=S.bass[i%S.bass.length],dc=S.dr[i%S.dr.length];
    if(mc!=='.')noteAt(m.a,t,midi(degNote(mc,S,S.root+12)),sd*1.6,S.lead,.16,m.g,S.lp);
    if(bc!=='.')noteAt(m.a,t,midi(degNote(bc,S,S.root-12)),sd*1.8,S.bw||'triangle',.3,m.g);
    if(dc!=='.')drum(m.a,t,dc,m.g,m.nb);
    m.next+=sd;m.step++;
  }
}
function musicStop(){
  if(mu.timer){clearInterval(mu.timer);try{mu.g.disconnect()}catch(e){}try{mu.c.disconnect()}catch(e){}}
  mu={timer:null};
}
function musicStart(){
  musicStop();
  if(selSong==='none'||state!=='menu')return;
  const S=SONGS.find(x=>x.id===selSong);if(!S)return;
  try{
    const a=ctx(),g2=a.createGain(),cp=a.createDynamicsCompressor();
    g2.gain.value=volOf(S.id)*.7;g2.connect(cp);cp.connect(a.destination);
    const len=a.sampleRate,nb=a.createBuffer(1,len,a.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    mu={a,g:g2,c:cp,S,nb,step:0,next:a.currentTime+.1,timer:setInterval(musicTick,30)};
  }catch(e){mu={timer:null}}
}

}

/* ---------- disparo ---------- */
function fire(){
  if(mode==='net')return fireNet();
  const p=air;
  const reach=Math.min(1,0.3+p*2.8);
  const T=(1.5-1.05*p)*reach;
  const start={x:KX,y:745};
  const aimP={x:cross.x+rand(-6,6),y:cross.y+rand(-6,6)};
  const tgt={x:start.x+(aimP.x-start.x)*reach,y:start.y+(aimP.y-start.y)*reach};
  let gx,gy;
  if(Math.random()<0.45){gx=aimP.x+rand(-45,45);gy=aimP.y+22+rand(-20,20)}
  else{gx=rand(GX0+30,GX1-30);gy=rand(170,225)}
  gx=clamp(gx,GX0+25,GX1-25);gy=clamp(gy,165,228);
  const delay=.22,dur=.38;
  const e=ease(clamp((T-delay)/dur,0,1));
  const gp={x:GCX+(gx-GCX)*e,y:200+(gy-200)*e};
  let res;
  const nearPost=((Math.abs(aimP.x-GX0)<10||Math.abs(aimP.x-GX1)<10)&&aimP.y>GY0-10&&aimP.y<GY1)||
                 (Math.abs(aimP.y-GY0)<10&&aimP.x>GX0-10&&aimP.x<GX1+10);
  const inside=aimP.x>GX0&&aimP.x<GX1&&aimP.y>GY0&&aimP.y<GY1;
  if(reach<1)res='short';
  else if(nearPost)res='post';
  else if(!inside)res='out';
  else if(Math.hypot(gp.x-aimP.x,gp.y-aimP.y)<54)res='save';
  else res='goal';
  let pts=0,cn=0;const bonus=[];
  if(res==='goal'){
    pts=100;cn=25;
    if(Math.abs(aimP.x-GCX)>100){pts+=50;cn+=10;bonus.push('¡Esquinazo! +50')}
    if(p>=0.9){pts+=50;cn+=15;bonus.push('¡Cañonazo! +50')}
  }
  shot={t:0,T,reach,start,tgt,aimP,res,gx,gy,delay,dur,fartDur:.5+p*1.3,pts,coins:cn,bonus,power:p,
        free:null,landed:false,startAir:air,gasAcc:0,big:p>=.9};
  state='shot';
  fartSound(p);
  shake=6+p*10+(p>=.9?12:0);
}

/* ---------- ball / arquero ---------- */
function ballPos(s){
  if(s.free)return s.free;
  const uu=Math.min(s.t/s.T,s.res==='out'?1.7:1);
  const x=s.start.x+(s.tgt.x-s.start.x)*uu;
  let y=s.start.y+(s.tgt.y-s.start.y)*uu;
  y-=Math.sin(Math.PI*Math.min(uu,1))*(25+(1-s.power)*55);
  return{x,y,sc:Math.max(.12,1-0.72*uu*s.reach)};
}
function goaliePos(){
  if(shot){
    const e=ease(clamp((shot.t-shot.delay)/shot.dur,0,1)),x0=shot.gx0===undefined?GCX:shot.gx0;
    return{x:x0+(shot.gx-x0)*e,y:200+(shot.gy-200)*e,tilt:(shot.gx-x0)/150*0.9*e,arms:0.4+0.6*e};
  }
  if((mode==='save'&&state==='sinflate')||state==='nkeep')return{x:gkX,y:200,tilt:0,arms:0.35+0.1*Math.sin(time*4)};
  return{x:GCX+Math.sin(time*2)*14,y:200,tilt:0,arms:0.35+0.1*Math.sin(time*4)};
}

/* ---------- update ---------- */
function update(dt){
  if(mode==='net'&&netQ.length)netPump();
  if(extraT>0)extraT-=dt;
  pulse=Math.max(0,pulse-dt*5);
  shake=Math.max(0,shake-dt*20);
  if(crowdJ>0)crowdJ-=dt;
  if(state==='ready'||state==='inflate'||state==='place'||state==='aim'||state==='sinflate'||state==='nkeep')bAir+=(air-bAir)*Math.min(1,dt*14);

  if(state==='inflate'){
    timer-=dt;
    if(timer<=0){timer=0;state='place';phaseT=0;beep(400,.15,'triangle',.07);if(mode==='net')netSendOpp({t:'ph',r:round,s:'place'})}
  }else if(state==='place'){
    if(phaseT>1.1){state='aim';aimT=0;phaseT=0;if(mode==='net')netSendOpp({t:'ph',r:round,s:'aim'})}
  }else if(state==='aim'){
    aimT+=dt;
    cross.x=GCX+Math.sin(aimT*2.6)*168;
    cross.y=GCY+Math.sin(aimT*3.4+1)*69;
    if(aimT>3.5)fire();
  }else if(state==='sinflate'){
    sT-=dt;
    air=Math.min(sPa,air+dt*sPa/1.8);
    if(Math.random()<dt*9)pulse=1;
    gkX+=((GX0+50+sChosen*100)-gkX)*Math.min(1,dt*10);
    if(sT<=0)fireSave();
  }else if(state==='nkeep'){
    gkX+=((GX0+50+sChosen*100)-gkX)*Math.min(1,dt*10);
    zT-=dt;if(zT<=0){zT=.4;netSendOpp({t:'zone',r:round,z:sChosen})}
  }else if(state==='shot'){
    const s=shot;s.t+=dt;
    bAir=Math.max(0,s.startAir*(1-s.t/s.fartDur));
    if(s.t<s.fartDur){
      s.gasAcc+=dt*(70+s.power*90)*(s.big?2:1);
      while(s.gasAcc>=1){s.gasAcc--;spawnGas()}
      shake=Math.max(shake,3+s.power*6+(s.big?8:0));
    }
    if(!s.landed&&s.t>=s.T){
      s.landed=true;
      const t=s.tgt,sc=1-0.72*s.reach;
      if(s.res==='goal'){
        s.free={x:t.x,y:t.y,sc,vx:0,vy:20,gr:250,vs:0};
        if(keepSide())beep(180,.4,'sawtooth',.07);
        else{confetti();crowdMsg='¡GOOOOOLLL!';crowdJ=2.8;shake=8;beep(660,.3,'triangle',.08);goalChant()}
      }
      else if(s.res==='save'){
        s.free={x:t.x,y:t.y,sc,vx:rand(-150,150)||90,vy:-120,gr:600,vs:.2};beep(200,.2,'square',.07);
        if(keepSide()){confetti();crowdMsg='¡¡ATAJADÓN!!';crowdJ=2.8;shake=8;beep(660,.3,'triangle',.08);goalChant()}
      }
      else if(s.res==='post'){s.free={x:t.x,y:t.y,sc,vx:rand(-100,100),vy:200,gr:300,vs:.6};beep(900,.12,'triangle',.08)}
    }
    if(s.free){
      const f=s.free;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=f.gr*dt;f.sc+=f.vs*dt;
      if(s.res==='goal'&&f.y>GY1-14){f.y=GY1-14;f.vy=0}
    }
    if(s.t>=s.T+.45){
      state='result';phaseT=0;
      if(mode==='net')opScore+=nrole==='kick'?(s.res==='save'?s.keepPts:0):(s.res==='goal'?s.kickPts:0);
      const win=keepSide()?s.res==='save':s.res==='goal';
      results.push(win);
      if(win){
        score+=s.pts;if(score>best){best=score;setBest(best)}
        const prev=total;total+=s.pts;setNum('pp_total',total);coins+=s.coins;setNum('pp_coins',coins);
        for(const sh of SHIRTS){
          if(sh.pts>prev&&sh.pts<=total){s.bonus.push('👕 ¡Camiseta '+sh.name+'!');beep(880,.25,'triangle',.08)}
          if(sh.pts>0&&sh.pts*2>prev&&sh.pts*2<=total){s.bonus.push('👕 ¡Visitante '+sh.name+'!');beep(880,.25,'triangle',.08)}
          if(sh.pts>0&&sh.pts*4>prev&&sh.pts*4<=total){s.bonus.push('🎽 ¡Entrenamiento '+sh.name+'!');beep(880,.25,'triangle',.08)}
        }
        for(const k of GKS){
          if(k.pts>0&&k.pts>prev&&k.pts<=total){s.bonus.push('🧤 ¡Arquero '+k.short+'!');beep(1040,.25,'triangle',.08)}
        }
      }
    }
  }

  if(mode==='net'){
    if(state==='ready'&&phaseT>7)tap(null);
    if(state==='result'&&nrole==='kick'&&phaseT>2.2)netAdvance();
  }
  for(const p of parts){
    p.life-=dt;p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;
    if(p.type==='conf'){p.vy+=40*dt;p.rot+=dt*6}
    if(p.type==='gas'){p.vx*=.98;p.vy-=10*dt;p.r+=p.grow*dt}
  }
  parts=parts.filter(p=>p.life>0);
  for(const t of texts){t.y-=30*dt;t.life-=dt}
  texts=texts.filter(t=>t.life>0);
}

}

function kickerExpr(){
  if(state==='ready')return'idle';
  if(state==='shot')return shot.t<shot.T+.05?'relief':(shot.res==='goal'?'happy':'sad');
  if(state==='result')return shot.res==='goal'?'happy':'sad';
  return'strain';
}

function drawCrowdShout(){
  if(crowdJ<=0)return;
  const m=crowdMsg,a=clamp(crowdJ/.6,0,1);
  g.globalAlpha=a;
  for(let i=0;i<m.length;i++){
    const k=Math.sin(time*9+i*.7);
    label(m[i],W/2-(m.length-1)*15.5+i*31,104+k*9,40+k*4,i%2?'#ffd21f':'#fff',k*.08);
  }
  g.globalAlpha=1;
}
function drawPlay(){
  g.save();
  if(shake>0)g.translate(rand(-shake,shake)*.5,rand(-shake,shake)*.5);
  drawBg();
  drawGoalBack();
  const gp=goaliePos();
  drawGoalie(gp.x,gp.y,gp.tilt,gp.arms,(mode==='net'&&nrole==='kick'&&opProf)?gkWith(GKS[opProf.gk],opProf.sh,opProf.aw):gkWith(GKS[selGk],selShirt,selAway));
  drawGoalFront();

  // pelota
  if(state==='place'){
    const k=ease(clamp(phaseT/.7,0,1));
    drawBall(-30+(KX+30)*k,745,1);
  }else if(state==='aim'||state==='sinflate'||state==='nkeep'){
    drawBall(KX,745,1);
  }else if(shot){
    const b=ballPos(shot);drawBall(b.x,b.y,b.sc);
  }

  // gas (detrás del pateador)
  for(const p of parts)if(p.type==='gas'){
    g.fillStyle='rgba(150,205,60,'+(clamp(p.life/p.max,0,1)*.6)+')';
    g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();
  }

  // pateador
  let ox=0;
  if(state==='shot'&&shot.t<shot.fartDur)ox=Math.sin(time*80)*4*(.3+shot.power);
  const sv=mode==='save',nk=mode==='net'&&nrole==='keep',kv=sv||nk,op=opProf||cleanProf(null);
  const kid=sv?CHARS[rival].id:nk?op.ch:CHARS[sel].id;
  drawKicker(kid,{air:bAir,pulse,time,expr:kickerExpr(),x:KX+ox,y:KY,s:1,shirt:sv?0:nk?op.sh:selShirt,away:sv?0:nk?op.aw:selAway,acc:nk?op.acc:eqOf(kid),gaze:sv?sHint-1:0});

  // partículas delante
  for(const p of parts){
    if(p.type==='puff'){g.fillStyle='rgba(255,255,255,'+clamp(p.life/p.max,0,1)+')';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}
    else if(p.type==='conf'){g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.col;g.fillRect(-4,-2,8,4);g.restore()}
  }
  // PRRRT
  if(state==='shot'&&shot.t<shot.fartDur+.4){
    const s=shot.big?64+Math.sin(time*40)*5:40+shot.power*50;
    label(shot.big?'¡¡BRAAAAP!!':'¡PRRRRT!',KX+Math.sin(time*50)*(shot.big?12:6),700,s,shot.big?'#e8ff5a':'#b6e04a',Math.sin(time*30)*(shot.big?.12:.06));
  }
  for(const t of texts){g.globalAlpha=clamp(t.life,0,1);label(t.s,t.x,t.y,t.size,t.col);g.globalAlpha=1}
  drawCrowdShout();
  g.restore();

  if(state==='shot'&&shot.big&&shot.t<.15){g.fillStyle='rgba(255,255,255,'+(.45*(1-shot.t/.15))+')';g.fillRect(0,0,W,H)}
  // mira
  if(state==='aim'){

function drawShirtIcon(S,x,y,w,h,col){
  const P=[[.30,.05],[.42,.05],[.5,.16],[.58,.05],[.70,.05],[.98,.28],[.82,.46],[.72,.38],[.72,.95],[.28,.95],[.28,.38],[.18,.46],[.02,.28]];

  P.forEach((q,i)=>i?g.lineTo(x+q[0]*w,y+q[1]*h):g.moveTo(x+q[0]*w,y+q[1]*h));
  g.closePath();

}

/* --- anfitrión --- */
function pubRoom(){
  return{kind:room.kind,cap:room.cap,code:room.code,hostId:room.hostId,started:room.started,champ:room.champ||null,
    matches:room.matches||null,table:room.table,players:room.players.map(p=>({id:p.id,name:p.name,gone:!!p.gone}))};

function bcastRoom(){bcast({t:'room',room:pubRoom()})}
function netHost(kind){
  if(!netOk())return;
  netClose();lob.view='connecting';lob.err=null;lob.t0=time;
  let tries=0;
  const open=()=>{
    const code=newCode(),pid=NET_PRE+code;let pr;
    try{pr=new Peer(pid)}catch(e){lobFail('No se pudo crear la sala');return}
    net.peer=pr;net.isHost=true;net.hostId=pid;
    pr.on('open',id=>{
      if(net.peer!==pr)return;
      net.id=id;
      room={kind,cap:kind==='duel'?2:4,code,hostId:id,players:[{id,name:player,prof:myProf()}],matches:null,champ:null,table:{},started:false};
      lob.view='room';
    });
    pr.on('connection',c=>hostAccept(c));
    pr.on('disconnected',()=>{
      const tryRe=n=>{
        if(net.peer!==pr||pr.destroyed||!pr.disconnected)return;

    });
    pr.on('error',e=>{
      if(net.peer!==pr)return;
      if(e&&e.type==='unavailable-id'&&tries++<5){try{pr.destroy()}catch(_){}net.peer=null;open();return}
      const m=netErrMsg(e);lobFail(m[0],m[1]);
    });
  };

}
function hostAccept(c){
  c.on('data',env=>{
    try{
      if(!env||!env.m)return;
      const m=env.m;
      if(m.t==='join'){
        if(c._in)return;
        if(!room||room.started||room.players.length>=room.cap){
          rawSend(c,{f:net.id,m:{t:'deny',why:room&&room.started?'La sala ya empezó':'La sala está llena'}});
          netLater(()=>{try{c.close()}catch(e){}},500);return;
        }
        c._in=true;net.conns[c.peer]=c;
        const prof=cleanProf(m.prof);
        let nm=prof.name,k=2;while(room.players.some(p=>p.name===nm))nm=prof.name.slice(0,10)+k++;
        prof.name=nm;
        room.players.push({id:c.peer,name:nm,prof});
        bcastRoom();return;
      }
      if(!c._in)return;
      if(env.to&&env.to!==net.id){const t=net.conns[env.to];if(t)rawSend(t,env);return}
      handleNet(c.peer,m);
    }catch(e){console.error(e)}

}
function hostDrop(id){
  if(!net.isHost||!room||!net.conns[id])return;
  delete net.conns[id];
  const i=room.players.findIndex(p=>p.id===id);if(i<0)return;
  if(!room.started){room.players.splice(i,1);bcastRoom();return}
  room.players[i].gone=true;
  const M=room.matches||{};
  for(const k in M){
    const m=M[k];
    if(m.w||!m.a||!(m.a===id||m.b===id))continue;
    const o=m.a===id?m.b:m.a;

}
function startPair(k){const m=room.matches[k];const go={t:'go',mid:k,a:m.a,b:m.b};sendTo(m.a,go);sendTo(m.b,go)}

  if(!net.isHost||!room||room.started)return;
  const P=room.players.filter(p=>!p.gone);
  if(room.kind==='duel'){
    if(P.length<2)return;
    const prev=room.matches&&room.matches.D;

    const a=flip?P[1].id:P[0].id,b=flip?P[0].id:P[1].id;

function advanceBracket(){
  if(!room||room.kind!=='tourney'||!room.matches)return;

  for(const k of ['S0','S1']){
    const m=M[k];if(m.w)continue;

/* --- cliente --- */
function netJoin(code){
  if(!netOk())return;

    c.on('data',env=>{try{if(env&&env.m)handleNet(env.f,env.m)}catch(e){console.error(e)}});
    c.on('close',()=>netHostLost());

  });
  pr.on('error',e=>{
    if(net.peer!==pr)return;

/* --- mensajes --- */
function handleNet(from,m){
  try{
    switch(m.t){
      case 'room':
        room=m.room;
        if(lob.view==='connecting')lob.view='room';
        break;
      case 'deny':lobFail(m.why||'No se pudo entrar');break;
      case 'go':netStart(m);break;
      case 'oppleft':if(m.mid===netMid)netForfeitWin();break;
      case 'mres':{
        if(!net.isHost||!room||!room.matches)break;
        const mm=room.matches[m.mid];
        if(!mm||!(mm.a===from||mm.b===from))break;
        const pl=room.players.find(p=>p.id===from);
        room._rep=room._rep||{};
        if(!room._rep[m.mid+from]){
          room._rep[m.mid+from]=1;
          const pp=clamp(+m.p||0,0,5000);
          if(pl)room.table[pl.name]=(room.table[pl.name]||0)+pp;
          if(mm.a===from)mm.sa=pp;else mm.sb=pp;
        }
        if(!mm.w){
          mm.w=(m.w===mm.a||m.w===mm.b)?m.w:from;
          if(room.kind==='duel'){room.started=false;bcastRoom()}else advanceBracket();
        }else bcastRoom();
        break}
      default:netGame(from,m);
    }
  }catch(e){console.error(e)}
}

/* --- partida online --- */
function netStart(m){

  round=1;rounds=NET_R;extraT=0;score=0;opScore=0;results=[];totalStart=total;coinsStart=coins;netRes=null;netQ=[];
  setStr('pp_sel',CHARS[sel].id);setNum('pp_away',selAway);setNum('pp_shirt',selShirt);setNum('pp_gk',selGk);

  sendTo(netOpp,{t:'hello',prof:myProf()});
}
function netGame(from,m){
  if(m.t==='hello'){profBy[from]=cleanProf(m.prof);if(from===netOpp&&mode==='net')opProf=profBy[from];return}
  if(mode!=='net'||from!==netOpp)return;
  if(m.t==='zone'){if(nrole==='kick'&&m.r===round)netZone=clamp(m.z|0,0,2);return}
  if(m.t==='air'){if(nrole==='keep'&&m.r===round)air=clamp(+m.a||0,0,1);return}
  if(m.t==='ph'){if(nrole==='keep'&&m.r===round)netPh=String(m.s);return}

function netPump(){
  for(let i=0;i<netQ.length;i++){
    const m=netQ[i].m;let ok=false,drop=false;
    if(m.t==='shot'){

    }else if(m.t==='next'){

function netApplyShot(m){

  shot={t:0,T:clamp(+S.T||1,.2,3),reach:clamp(+S.reach||1,.1,1),start:{x:KX,y:745},tgt:pt(S.tgt),aimP:pt(S.aimP),

function fireNet(){
  const p=air,reach=Math.min(1,0.3+p*2.8),T=(1.5-1.05*p)*reach,start={x:KX,y:745};
  const aimP={x:cross.x+rand(-6,6),y:cross.y+rand(-6,6)};
  const tgt={x:start.x+(aimP.x-start.x)*reach,y:start.y+(aimP.y-start.y)*reach};
  const z=netZone,col=aimP.x<GX0+100?0:aimP.x<GX0+200?1:2;
  const nearPost=((Math.abs(aimP.x-GX0)<10||Math.abs(aimP.x-GX1)<10)&&aimP.y>GY0-10&&aimP.y<GY1)||
                 (Math.abs(aimP.y-GY0)<10&&aimP.x>GX0-10&&aimP.x<GX1+10);
  const inside=aimP.x>GX0&&aimP.x<GX1&&aimP.y>GY0&&aimP.y<GY1;
  let res;
  if(reach<1)res='short';else if(nearPost)res='post';else if(!inside)res='out';else res=z===col?'save':'goal';
  let gx=GX0+50+z*100,gy=205;
  if(res==='save'){gx=clamp(aimP.x,GX0+25,GX1-25);gy=clamp(aimP.y+10,165,228)}
  let pts=0,cn=0,kp=0,kc=0;const bonus=[],kb=[];
  if(res==='goal'){pts=100;cn=25;if(Math.abs(aimP.x-GCX)>100){pts+=50;cn+=10;bonus.push('¡Esquinazo! +50')}if(p>=.9){pts+=50;cn+=15;bonus.push('¡Cañonazo! +50')}}
  if(res==='save'){kp=100;kc=25;if(p>=.9){kp+=50;kc+=15;kb.push('¡Cañonazo atajado! +50')}}
  shot={t:0,T,reach,start,tgt,aimP,res,gx,gy,delay:.22,dur:.38,fartDur:.5+p*1.3,pts,coins:cn,bonus,kickPts:pts,keepPts:kp,
        power:p,free:null,landed:false,startAir:air,gasAcc:0,big:p>=.9};
  state='shot';fartSound(p);shake=6+p*10+(p>=.9?12:0);
  netSendOpp({t:'shot',r:round,s:{T,reach,tgt,aimP,res,gx,gy,power:p,pts,coins:cn,kp,kc,kb}});
}
function netAdvance(){
  const done=(round>=NET_R&&round%2===0&&score!==opScore)||round>=NET_MAX;
  if(done){netSendOpp({t:'end',r:round});netFinish();return}
  round++;nrole='keep';
  netSendOpp({t:'next',r:round});
  newRound();
}
function netFinish(){
  const win=score>opScore||(score===opScore&&netFirst);
  netRes={win,draw:score===opScore&&room&&room.kind==='duel',forfeit:false};
  if(room&&room.kind==='duel'&&!netRes.draw)recFriend(oppName,win);
  recordRank();
  toHost({t:'mres',mid:netMid,w:win?net.id:netOpp,p:score});
  state='over';phaseT=0;
}
function netForfeitWin(){
  if(mode!=='net'||state==='over'||state==='lobby'||state==='menu')return;
  netRes={win:true,draw:false,forfeit:true};
  if(room&&room.kind==='duel')recFriend(oppName,true);
  recordRank();
  toHost({t:'mres',mid:netMid,w:net.id,p:score});
  state='over';phaseT=0;
}
function netOpen(){state='lobby';lob.view='home';lob.code='';lob.inv=''}

/* --- zona de amigos (lista guardada en este dispositivo) --- */
function getFriends(){try{const a=JSON.parse(getStr('pp_friends','[]'));return Array.isArray(a)?a.filter(f=>f&&typeof f.n==='string').slice(0,40).map(f=>({n:f.n.slice(0,12),w:f.w|0,l:f.l|0})):[]}catch(e){return[]}}
let friends=getFriends();
function saveFriends(){setStr('pp_friends',JSON.stringify(friends))}
const isFriend=n=>friends.some(f=>f.n===n);
function addFriend(n){
  n=(n||'').slice(0,12);if(!n||n===player||isFriend(n))return false;
  if(friends.length>=40)friends.shift();
  friends.push({n,w:0,l:0});saveFriends();return true;
}
function recFriend(n,win){const f=friends.find(x=>x.n===n);if(f){if(win)f.w++;else f.l++;saveFriends()}}
function inviteLink(code){
  try{if(/^https?:/.test(location.protocol))return location.origin+location.pathname+'?sala='+code}catch(e){}
  return '';
}
function shareInvite(){
  if(!room)return;
  const lk=inviteLink(room.code);
  const tx=(lob.inv?lob.inv+', ':'')+'jugá un penal conmigo en Penal a Pedo. Código de sala: '+room.code+(lk?' · Entrá directo: '+lk:' (en el juego: ONLINE > Tengo un código)');
  try{if(navigator.share)navigator.share({text:tx}).catch(()=>{});else{navigator.clipboard.writeText(tx);say('Invitación copiada')}}catch(e){say('Código: '+room.code)}
}
const LFR={x:60,y:618,w:360,h:56},LINV={x:60,y:128,w:360,h:54},FADD={x:60,y:376,w:360,h:44};
const FPP=5,FPL={x:60,y:524,w:80,h:40},FPR={x:340,y:524,w:80,h:40};
const frowR=k=>({x:40,y:196+k*64,w:400,h:58}),finvR=k=>({x:326,y:196+k*64+9,w:104,h:40}),fdelR=k=>({x:46,y:196+k*64+9,w:36,h:40});
let pendingJoin='';
try{const q=new URLSearchParams(location.search).get('sala');if(q){const c=q.toUpperCase().slice(0,4);if(c.length===4&&c.split('').every(ch=>CODE_CH.includes(ch)))pendingJoin=c}}catch(e){}
function bootJoin(){
  const c=pendingJoin;pendingJoin='';if(!c)return;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  state='lobby';lob.view='code';lob.code=c;lob.inv='';netJoin(c);
}
function friendsTap(p){
  const NPG=Math.max(1,Math.ceil(friends.length/FPP));
  if(lob.fp>=NPG)lob.fp=NPG-1;
  if(inR(p,LBACK)){lob.view='home';beep(400,.05);return}
  if(inR(p,LINV)){lob.inv='';beep(660,.1);netHost('duel');return}
  for(let k=0;k<FPP;k++){
    const f=friends[lob.fp*FPP+k];if(!f)break;
    if(inR(p,finvR(k))){lob.inv=f.n;beep(660,.1);netHost('duel');return}
    if(inR(p,fdelR(k))){friends.splice(lob.fp*FPP+k,1);saveFriends();say(f.n+' salió de tu lista');beep(300,.08);return}
  }
  if(NPG>1){
    if(inR(p,FPL)){lob.fp=(lob.fp+NPG-1)%NPG;beep(500,.05)}
    else if(inR(p,FPR)){lob.fp=(lob.fp+1)%NPG;beep(500,.05)}
  }
}
function drawFriends(){
  label('AMIGOS',W/2,90,54,'#ffd21f');
  btn(LINV,'Invitar a jugar','#34c759',24);
  const NPG=Math.max(1,Math.ceil(friends.length/FPP));
  if(lob.fp>=NPG)lob.fp=NPG-1;
  if(!friends.length){
    label('Todavía no tenés amigos guardados',W/2,250,19,'#fff');
    label('Creá una sala 1 contra 1, pasales el link',W/2,290,16,'#fff');
    label('y cuando entren tocá "Agregar como amigo".',W/2,314,16,'#fff');
  }
  for(let k=0;k<FPP;k++){
    const f=friends[lob.fp*FPP+k];if(!f)break;
    const r=frowR(k);
    g.fillStyle='rgba(255,255,255,.88)';g.beginPath();g.roundRect(r.x,r.y,r.w,r.h,12);g.fill();
    const d=fdelR(k);g.fillStyle='#e0553b';g.beginPath();g.roundRect(d.x,d.y,d.w,d.h,8);g.fill();
    label('✕',d.x+d.w/2,d.y+28,20,'#fff');
    g.textAlign='left';g.fillStyle='#222';g.font='bold 20px sans-serif';g.fillText(f.n,96,r.y+26);
    g.font='14px sans-serif';g.fillStyle='#555';g.fillText('Ganaste '+f.w+' · Perdiste '+f.l,96,r.y+47);
    g.textAlign='center';
    const v=finvR(k);btn(v,'Invitar','#2f8fe0',18);
  }
  if(NPG>1){
    btn(FPL,'◀','#555',22);btn(FPR,'▶','#555',22);
    label((lob.fp+1)+' / '+NPG,W/2,552,18,'#fff');
  }
  label('Les llega por WhatsApp o donde vos elijas.',W/2,596,15,'#fff');
  label('No hay aviso automático ni lista de conectados.',W/2,616,13,'#ffd21f');
  btn(LBACK,'Volver','#555');
}

/* --- lobby: entrada y dibujo --- */
const LB1={x:60,y:205,w:360,h:58},LB2={x:60,y:273,w:360,h:58},LB3={x:60,y:412,w:360,h:58},LSHARE={x:60,y:560,w:360,h:50};
const LBACK={x:130,y:704,w:220,h:60},LACT={x:60,y:628,w:360,h:56};
const KEYS=CODE_CH.split('').concat(['⌫']);
const keyRect=i=>({x:30+(i%6)*70,y:340+Math.floor(i/6)*66,w:62,h:58});
function otherPlayer(){return room&&room.players.find(p=>p.id!==net.id&&!p.gone)||null}
function hostActionText(){
  if(!net.isHost||!room||room.started)return '';
  const n=room.players.filter(p=>!p.gone).length;
  if(room.kind==='duel')return n<2?'':(room.matches?'¡Revancha!':'¡Jugar!');
  return n<4?'':(room.matches?'Nuevo torneo':'¡Empezar torneo!');
}
function lobbyTap(p){
  if(!p)return;
  const v=lob.view;
  if(v==='home'){
    if(!lob.err&&p.y>118&&p.y<156){openName('rename','lobby');beep(600,.06)}
    else if(inR(p,LB1)){beep(600,.06);lob.inv='';netHost('duel')}
    else if(inR(p,LB2)){beep(600,.06);lob.inv='';netHost('tourney')}
    else if(inR(p,LB3)){beep(600,.06);lob.inv='';lob.view='code';lob.code=''}
    else if(inR(p,LFR)){beep(600,.06);lob.view='friends';lob.fp=0}
    else if(inR(p,LBACK)){state='menu';beep(400,.05)}
  }else if(v==='code'){
    for(let i=0;i<KEYS.length;i++)if(inR(p,keyRect(i))){
      if(i===KEYS.length-1)lob.code=lob.code.slice(0,-1);
      else if(lob.code.length<4)lob.code+=KEYS[i];
      beep(700,.04);return;
    }
    if(inR(p,LACT)&&lob.code.length===4){netJoin(lob.code);return}
    if(inR(p,LBACK)){lob.view='home';beep(400,.05)}
  }else if(v==='friends'){friendsTap(p);
  }else if(v==='connecting'){
    if(inR(p,LBACK)){netClose();lob.view='home'}
  }else if(v==='room'){
    if(inR(p,LBACK)){netClose();lob.view='home';beep(400,.05);return}
    if(net.isHost&&room&&!room.matches&&!Object.keys(room.table||{}).length&&inR(p,LSHARE)){shareInvite();return}
    {const o=otherPlayer();if(o&&o.name!==player&&inR(p,FADD)&&!isFriend(o.name)&&room.kind==='duel'){if(addFriend(o.name)){coinSfx();say('¡'+o.name+' ahora es tu amigo!')}return}}
    if(inR(p,LACT)&&hostActionText()){beep(660,.1);hostStart()}
  }
}
function btn(r,txt,col,sz){
  sz=sz||26;
  g.fillStyle=col;g.beginPath();g.roundRect(r.x,r.y,r.w,r.h,16);g.fill();
  g.strokeStyle='#fff';g.lineWidth=4;g.stroke();
  label(txt,r.x+r.w/2,r.y+r.h/2+sz*.35,sz,'#fff');
}
function drawLobby(){
  drawBg();
  if(lob.view!=='friends')label('ONLINE',W/2,90,54,'#ffd21f');
  const v=lob.view;
  if(v==='home'){
    if(lob.err){
      g.fillStyle='rgba(170,30,30,.94)';g.beginPath();g.roundRect(24,102,432,80,14);g.fill();
      g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
      fitText(lob.err.m,W/2,134,410,20,'#fff');
      if(lob.err.d)fitText(lob.err.d,W/2,162,410,15,'#ffe6a0');
    }else label('Jugás como: '+player+'  ✎',W/2,140,20,'#fff');
    label('① CREAR una sala (vos sos el anfitrión)',W/2,192,18,'#ffd21f');
    btn(LB1,'Crear sala 1 contra 1','#34c759',24);btn(LB2,'Crear torneo de 4','#e0553b',24);
    label('Te sale un código de 4 letras para pasarles',W/2,358,16,'#fff');
    label('② ENTRAR a la sala de otro',W/2,400,18,'#ffd21f');
    btn(LB3,'Tengo un código','#2f8fe0',24);
    label('Pedile el código a quien creó la sala',W/2,498,16,'#fff');
    label('1 contra 1: uno patea y el otro ataja, y se turnan.',W/2,560,15,'#fff');
    label('Torneo: semifinales y final entre 4.',W/2,584,15,'#fff');
    btn(LFR,'👥 Mis amigos','#e0a21d',24);
    if(typeof Peer==='undefined')label('Sin módulo online',W/2,604,20,'#ff6b6b');
    btn(LBACK,'Volver','#555');
  }else if(v==='friends'){drawFriends();
  }else if(v==='code'){
    label('Escribí el código de la sala',W/2,170,22,'#fff');
    for(let i=0;i<4;i++){
      const x=W/2-150+i*80;
      g.fillStyle='rgba(255,255,255,.88)';g.beginPath();g.roundRect(x,200,70,86,12);g.fill();
      if(lob.code[i])label(lob.code[i],x+35,262,52,'#222');
    }
    for(let i=0;i<KEYS.length;i++){
      const r=keyRect(i);
      g.fillStyle=i===KEYS.length-1?'#e0553b':'rgba(255,255,255,.9)';g.beginPath();g.roundRect(r.x,r.y,r.w,r.h,10);g.fill();
      g.textAlign='center';g.fillStyle=i===KEYS.length-1?'#fff':'#222';g.font='bold 30px sans-serif';g.fillText(KEYS[i],r.x+r.w/2,r.y+40);
    }
    btn(LACT,'Entrar',lob.code.length===4?'#34c759':'#777');
    btn(LBACK,'Volver','#555');
  }else if(v==='connecting'){
    label('Conectando'+'.'.repeat(1+Math.floor(time*2)%3),W/2,330,38,'#fff');
    label('con el servidor de salas',W/2,370,20,'#ffd21f');
    if(time-lob.t0>5)label('Está tardando... revisá tu internet',W/2,410,18,'#ff9d1f');
    btn(LBACK,'Cancelar','#555');
  }else if(v==='room'&&room){
    label(room.kind==='duel'?'Sala 1 contra 1':'Torneo de 4',W/2,140,26,'#fff');
    label('CÓDIGO DE LA SALA',W/2,182,16,'#ffd21f');
    label(room.code,W/2,250,72,'#fff');
    if(net.peer&&net.peer.disconnected)label('Reconectando con el servidor...',W/2,276,16,'#ff9d1f');
    else if(net.isHost&&lob.inv&&!room.matches)label('Invitando a '+lob.inv,W/2,276,17,'#7bd88f');
    const row=(y,txt,right,col)=>{
      g.fillStyle=col||'rgba(255,255,255,.85)';g.beginPath();g.roundRect(40,y,400,34,10);g.fill();
      g.textAlign='left';g.fillStyle='#222';g.font='bold 17px sans-serif';g.fillText(txt,52,y+23);
      if(right){g.textAlign='right';g.fillStyle='#2f8fe0';g.fillText(right,428,y+23)}
      g.textAlign='center';
    };
    if(room.kind==='tourney'&&room.matches){
      const M=room.matches,pl=(id)=>id?nameOf(id):'?';
      const mr=(k,t)=>{const m=M[k],y=k==='S0'?290:k==='S1'?330:370;
        row(y,t+': '+pl(m.a)+' vs '+pl(m.b),m.w?(m.w==='x'?'—':'Ganó '+nameOf(m.w)):'',m.w?'#e8f7d9':null)};
      mr('S0','Semi 1');mr('S1','Semi 2');mr('F','Final');
      if(room.champ)label('🏆 Campeón: '+nameOf(room.champ),W/2,432,28,'#ffd21f');
    }else{
      for(let i=0;i<room.cap;i++){
        const p=room.players[i];
        row(290+i*40,p?p.name+(p.id===room.hostId?'  (anfitrión)':'')+(p.id===net.id?'  (vos)':''):'esperando jugador...',p?'✔':'',p?null:'rgba(255,255,255,.4)');
      }
    }
    const T=Object.keys(room.table||{}).map(n=>({n,p:room.table[n]})).sort((a,b)=>b.p-a.p).slice(0,4);
    if(T.length){
      label('Ranking de la sala',W/2,490,18,'#ffd21f');
      T.forEach((e,i)=>{g.textAlign='left';g.fillStyle='#fff';g.font='bold 17px sans-serif';g.fillText((i+1)+'. '+e.n,100,522+i*26);g.textAlign='right';g.fillText(e.p+' pts',380,522+i*26);g.textAlign='center'});
    }
    {const o=otherPlayer();if(room.kind==='duel'&&o&&o.name!==player&&!isFriend(o.name))btn(FADD,'＋ Agregar a '+o.name+' como amigo','#e0a21d',17);
     else if(room.kind==='duel'&&o&&o.name!==player&&isFriend(o.name))label('👥 '+o.name+' es tu amigo',W/2,404,17,'#7bd88f')}
    const ha=hostActionText(),wait=!room.matches&&!Object.keys(room.table||{}).length;
    if(wait){
      if(net.isHost){
        label('1. Mandales la invitación (link y código)',W/2,486,17,'#fff');
        label('2. Ellos tocan ONLINE > Tengo un código',W/2,512,17,'#fff');
        label('3. Cuando estén todos, tocá ¡Jugar!',W/2,538,17,'#ffd21f');
        btn(LSHARE,'Invitar (compartir)','#2f8fe0',22);
      }else label('Ya estás adentro. Esperá a que el anfitrión toque ¡Jugar!',W/2,500,16,'#ffd21f');
    }
    if(ha)btn(LACT,ha,'#34c759');
    else label(net.isHost?(room.started?'Partido en juego...':'Esperando jugadores...'):(room.started?'Partido en juego...':'Esperando al anfitrión...'),W/2,664,20,'#ffd21f');
    btn(LBACK,'Salir','#555');
  }
  if(menuMsgT>0){g.globalAlpha=Math.min(1,menuMsgT);label(menuMsg,W/2,788,15,'#ffd21f');g.globalAlpha=1}
}
function drawNetHud(){
  g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,W,40);
  g.textAlign='left';g.fillStyle='#fff';g.font='bold 15px sans-serif';g.fillText('Ronda '+round+'/'+rounds,10,26);
  fitText(player+' '+score+' – '+opScore+' '+oppName,W/2,26,230,16,'#fff');
  g.textAlign='right';g.font='bold 14px sans-serif';g.fillStyle=nrole==='kick'?'#7bd88f':'#ffd21f';
  g.fillText(nrole==='kick'?'PATEÁS':'ATAJÁS',W-10,25);
  coinIcon(W-72,58,8);g.fillStyle='#ffd21f';g.font='bold 16px sans-serif';g.textAlign='right';g.fillText(String(coins),W-12,64);
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  time+=dt;phaseT+=dt;if(menuMsgT>0)menuMsgT-=dt;
  try{
    if(state!=='menu'&&state!=='over'&&state!=='lobby'&&state!=='name')update(dt);
    if(state==='menu')drawMenu();else if(state==='over')drawOver();else if(state==='lobby')drawLobby();else if(state==='name')drawName();else drawPlay();
  }catch(err){
    console.error(err);
    g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if(pendingJoin&&state==='menu')bootJoin();
</script>
